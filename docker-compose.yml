# Local dev: health-db + its own disposable postgres:18.
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: health_app
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: health_app
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_app -d health_app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql # postgres:18+ image mounts data in a subdirectory

  health-db:
    build: .
    image: health-db:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PSQL_URL: postgres # service name on the compose network
      PSQL_PORT: "5432"
      PSQL_USER: health_app
      PSQL_TABLE: health_app
      PSQL_PASSWORD: local-dev-password
      INGEST_SECRET: local-dev-ingest-secret
      INGEST_HEADER: X-Ingest-Token
      HOST: 0.0.0.0
      PORT: "8000"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
    ports:
      - "8000:8000"
      - "8100:8100"
    volumes:
      - health-data:/app/data

volumes:
  pgdata:
  health-data: