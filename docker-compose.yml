# Docker self-hosted deployment — Docker Project file.
#
# Build the image ON THE host(no cross-machine image transfer). SSH into the
# hostand run, in this folder:
#     sudo docker build -t health-db:latest .
# The image then shows up in Docker -> Image, so the Project below
# can start it (Docker's Import only takes built tarballs, and
# Projects expect the image to already exist).
#
# Then: Docker -> Project -> Create, name health-db, path
# health-db (the wizard picks up this file).
#
# .env must sit next to this file (same folder) and is read as-is.
#
# One-time setup on the host:
#   sudo mkdir -p health-db/data
#   sudo chown -R 10001:10001 health-db/data
#
# PSQL_* comes from .env. PSQL_URL is the LAN IP (or its hostname) and
# PSQL_PORT is the published postgres port.
services:
  health-db:
    image: health-db:latest
    container_name: health-db
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
    ports:
      - "8000:8000" # ingest (HAE automations + Manual Export)
      - "8100:8100" # MCP streamable-http
    volumes:
      - health-db/data:/app/data # verbatim archive + pending queue (iron law 2)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
